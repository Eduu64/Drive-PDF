# ============================================================================
# NAS-PDF Lite — proxy inverso (única puerta de entrada del NAS)
#
# Qué hace:
#  1. ALLOWLIST LAN: solo acepta conexiones de redes privadas. Cualquier otra
#     dirección (Internet) recibe 403 antes de tocar la app.
#  2. Reenvía TODO al backend por la red interna de Docker (nas-pdf), que no
#     tiene puertos publicados ni salida a Internet.
#  3. Preparado para SSE (sin buffering) y para subidas grandes (streaming,
#     sin ficheros temporales).
#  4. Añade cabeceras de seguridad y oculta la versión del servidor.
#
# La app vuelve a filtrar por IP detrás del proxy (defensa en profundidad):
# aunque alguien atacase el nginx, el backend seguiría filtrando.
# ============================================================================

worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stderr;

    # no anunciar versión
    server_tokens off;

    # subidas: holgado para MAX_MB=512 + margen; streaming al backend
    # (si cambias MAX_MB, sube esto por encima)
    client_max_body_size 600m;
    client_body_timeout 120s;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    # cabeceras de seguridad para TODAS las respuestas
    # (la CSP estricta ya la manda la propia app; aquí el aislamiento extra)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    upstream nas_pdf_backend {
        # nombre del servicio en docker-compose, resuelto por la red interna
        server nas-pdf:8090;
        keepalive 8;
    }

    server {
        listen 8090;

        # ---- SOLO TU LAN ----
        # (mismo criterio que el filtro de la app; nginx lo aplica ANTES)
        allow 127.0.0.0/8;
        allow ::1/128;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 169.254.0.0/16;   # link-local
        allow 100.64.0.0/10;    # CGNAT (algunos operadores)
        allow fc00::/7;         # ULA IPv6
        allow fe80::/10;        # link-local IPv6
        deny all;

        location / {
            proxy_pass http://nas_pdf_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            # SSE / eventos en tiempo real: sin buffering y sin cortar conexiones largas
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # subidas en streaming (sin ficheros temporales en el proxy)
            proxy_request_buffering off;
        }
    }
}
